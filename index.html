<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#f3f6fb" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#12151b" media="(prefers-color-scheme: dark)" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gaegu:wght@400;700&display=swap" rel="stylesheet" />
<title>다짐</title>
<style>
  :root {
    --bg: #f3f6fb; --card: #ffffff; --ink: #3b4757; --on-ink: #ffffff; --text: #333f4d;
    --muted: #8a94a3; --faint: #b3bcca; --line: #e5eaf2;
    --accent: #4a90e2; --accent-soft: #eaf2fc;
    --good: #2f8f6b; --bad: #d1573f; --good-bg: #eaf4ef; --bad-bg: #f9ede9; --shadow: 0 1px 3px rgba(50,70,100,.05);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151b; --card: #1a1e26; --ink: #ccd6e4; --on-ink: #141821; --text: #d4dbe6;
      --muted: #828d9c; --faint: #58616f; --line: #29303b;
      --accent: #5b9be8; --accent-soft: #1c2836;
      --good: #6fc39a; --bad: #e08a72; --good-bg: #172620; --bad-bg: #281a15; --shadow: none;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: "Jua", "Pretendard", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    line-height: 1.55; padding: 0 20px calc(104px + env(safe-area-inset-bottom));
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; font-variant-numeric: tabular-nums;
  }
  .wrap { max-width: 540px; margin: 0 auto; }
  .icon { width: 19px; height: 19px; display: block; stroke: currentColor; fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .ic-wrap { display: inline-flex; }

  header { padding: 32px 2px 6px; }
  h1 { font-size: 21px; font-weight: 600; margin: 0; letter-spacing: -0.02em; }
  .auth-brand h1 { display: inline-block; border-bottom: 3px solid var(--accent); border-radius: 2px; padding-bottom: 2px; }
  .brand-logo { height: 54px; width: auto; display: block; }
  .sub { color: var(--muted); font-size: 13px; margin: 5px 0 0; letter-spacing: -0.01em; }
  .overline { font-size: 11px; color: var(--muted); font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; }

  /* 요약 */
  .summary { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 22px; box-shadow: var(--shadow); margin: 20px 0; }
  .settle-amt { font-size: 42px; font-weight: 500; letter-spacing: -0.035em; margin: 10px 0 2px; line-height: 1; }
  .settle-amt.pos { color: var(--good); }
  .settle-amt.neg { color: var(--bad); }
  .settle-cap { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 10px; }
  .settle-toggle { border: 1px solid var(--line); background: transparent; color: var(--muted); font-family: inherit; font-size: 11px; font-weight: 600; padding: 3px 10px; border-radius: 999px; cursor: pointer; letter-spacing: -0.01em; }
  .settle-toggle:active { background: color-mix(in srgb, var(--ink) 6%, transparent); }
  .stat-row { display: flex; margin-top: 20px; border-top: 1px solid var(--line); padding-top: 16px; }
  .stat { flex: 1; display: flex; flex-direction: column; gap: 5px; padding: 0 14px; }
  .stat:first-child { padding-left: 0; }
  .stat:not(:first-child) { border-left: 1px solid var(--line); }
  .stat .s-l { font-size: 11px; color: var(--muted); }
  .stat .s-v { font-size: 16px; font-weight: 700; letter-spacing: -0.01em; }
  .stat .s-v.good { color: var(--good); }
  .stat .s-v.bad { color: var(--bad); }

  /* 다가오는 마감 */
  .deadline-alert { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px 18px; box-shadow: var(--shadow); margin-bottom: 16px; }
  .deadline-alert .overline { display: block; margin-bottom: 6px; }
  .dl-item { display: flex; align-items: center; gap: 13px; padding: 10px 0; cursor: pointer; }
  .dl-item + .dl-item { border-top: 1px solid var(--line); }
  .dl-item:active { opacity: .6; }
  .dl-dday { font-size: 14px; font-weight: 700; letter-spacing: -0.02em; min-width: 48px; }
  .dl-dday.soon { color: var(--bad); }
  .dl-body { flex: 1; min-width: 0; }
  .dl-name { font-size: 14.5px; font-weight: 600; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dl-sub { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
  .dl-date { font-size: 12px; color: var(--muted); flex: 0 0 auto; }

  /* 달력 */
  .calendar { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 18px; box-shadow: var(--shadow); }
  .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .cal-title { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
  .cal-nav { display: flex; gap: 2px; align-items: center; position: relative; }
  .cal-nav .cal-jump-hidden { position: absolute; opacity: 0; width: 1px; height: 1px; pointer-events: none; bottom: 0; left: 0; }
  .cal-nav button { border: none; background: transparent; color: var(--muted); cursor: pointer; padding: 6px; border-radius: 8px; line-height: 0; display: inline-flex; }
  .cal-nav button:hover { color: var(--ink); }
  .cal-dow { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-bottom: 8px; }
  .cal-dow span { text-align: center; font-size: 10.5px; color: var(--muted); font-weight: 600; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cal-day { aspect-ratio: 1/1; border: 1px solid transparent; border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; cursor: pointer; transition: background .12s ease, border-color .12s ease; }
  .cal-day.blank { cursor: default; }
  .cal-day .d-num { font-size: 13px; font-weight: 500; }
  .cal-day.future .d-num { color: var(--faint); }
  .cal-day.today { border-color: var(--accent); }
  .cal-day.selected { background: color-mix(in srgb, var(--ink) 9%, transparent); border-color: var(--ink); }
  .cal-day:not(.blank):not(.selected):active { transform: scale(0.94); }
  .cal-dots { display: flex; gap: 3px; height: 5px; align-items: center; }
  .cal-dot { width: 4px; height: 4px; border-radius: 50%; }
  .cal-dot.done { background: var(--accent); }
  .cal-dot.slip { background: var(--bad); }
  .cal-dot.deadline { width: 6px; height: 6px; background: transparent; border: 1.5px solid var(--ink); box-sizing: border-box; }
  .cal-dot.event { background: var(--muted); }
  .cal-day.deadline-day { border-color: var(--ink); border-style: dashed; }
  .cal-day.deadline-day.selected, .cal-day.deadline-day.today { border-style: solid; }
  .cal-legend { display: flex; gap: 18px; justify-content: center; flex-wrap: wrap; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); }
  .cal-legend span { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); font-weight: 600; }
  .cal-legend .cal-dot { width: 5px; height: 5px; }
  .cal-legend .cal-dot.deadline { width: 7px; height: 7px; }

  /* 선택한 날 */
  .dd-head { display: flex; align-items: baseline; gap: 9px; margin: 24px 2px 14px; }
  .dd-date { font-size: 16px; font-weight: 600; letter-spacing: -0.01em; border-bottom: 2.5px solid var(--accent); padding-bottom: 2px; border-radius: 2px; }
  .dd-today { font-size: 11px; color: var(--accent); font-weight: 600; letter-spacing: 0.03em; border: 1px solid var(--accent); padding: 2px 8px; border-radius: 999px; }
  .section-title { font-size: 11px; font-weight: 600; color: var(--muted); margin: 22px 2px 12px; letter-spacing: 0.09em; text-transform: uppercase; }
  .section-title::before { content: "✓"; color: var(--accent); font-weight: 800; margin-right: 6px; }

  /* 이 날 할 일 (일정) */
  .ev-row { display: flex; align-items: center; gap: 11px; padding: 9px 0; }
  .ev-row + .ev-row { border-top: 1px solid var(--line); }
  .ev-check { flex: 0 0 auto; width: 22px; height: 22px; border: 1.5px solid var(--line); border-radius: 7px; background: transparent; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; padding: 0; color: var(--on-ink); }
  .ev-check.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .ev-check .icon { width: 14px; height: 14px; stroke-width: 2.4; }
  .ev-text { flex: 1; font-size: 14.5px; letter-spacing: -0.01em; word-break: break-word; }
  .ev-text.done { color: var(--muted); text-decoration: line-through; }

  /* 카드 */
  .task { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 18px; box-shadow: var(--shadow); margin-bottom: 12px; }
  .task-top { display: flex; align-items: center; gap: 8px; margin-bottom: 15px; }
  .task-name { font-size: 16px; font-weight: 600; flex: 1; letter-spacing: -0.01em; }
  .badge { font-size: 11px; font-weight: 600; letter-spacing: 0.04em; white-space: nowrap; color: var(--muted); }
  .badge.good { color: var(--good); }
  .badge.bad { color: var(--bad); }
  .badge.ink { color: var(--accent); }
  .icon-btn { border: none; background: transparent; color: var(--faint); cursor: pointer; padding: 4px; border-radius: 8px; line-height: 0; display: inline-flex; }
  .icon-btn:hover { color: var(--ink); }
  .icon-btn.del:hover { color: var(--bad); }

  .progress { height: 4px; background: var(--line); border-radius: 999px; overflow: hidden; margin-bottom: 15px; }
  .progress > span { display: block; height: 100%; background: var(--accent); border-radius: 999px; transition: width .3s ease; }
  .progress.done > span { background: var(--good); }

  .status-line { font-size: 13.5px; font-weight: 600; margin-bottom: 3px; letter-spacing: -0.01em; }
  .status-sub { font-size: 12px; color: var(--muted); margin-bottom: 15px; }
  .rule-line { font-size: 11.5px; color: var(--muted); margin-top: 15px; }

  .day-toggle { width: 100%; border: 1px solid var(--line); background: transparent; color: var(--text); border-radius: 11px; padding: 12px; font-weight: 600; font-size: 13.5px; cursor: pointer; font-family: inherit; letter-spacing: -0.01em; transition: background .15s ease, border-color .15s ease; }
  .day-toggle.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  .day-toggle:disabled { opacity: .4; cursor: not-allowed; }
  .day-toggle:not(:disabled):active { transform: scale(0.99); }
  .sel-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .sel-cnt { font-size: 13.5px; font-weight: 600; letter-spacing: -0.01em; }
  .sel-btns { display: flex; gap: 8px; }
  .sel-btns button { border: 1px solid var(--line); background: transparent; border-radius: 9px; padding: 8px 13px; font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit; color: var(--text); }
  .sel-btns .add { color: var(--bad); }
  .sel-btns button:disabled { opacity: .4; cursor: not-allowed; }

  .editor { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 11px; }
  .editor .row { display: flex; align-items: center; justify-content: space-between; font-size: 13px; color: var(--text); gap: 10px; }
  .field { border: 1px solid var(--line); background: var(--bg); color: var(--text); border-radius: 9px; padding: 8px 11px; font-size: 14px; font-family: inherit; outline: none; transition: border-color .15s ease; }
  .field:focus { border-color: var(--ink); }
  .editor .row .field { width: 130px; text-align: right; }
  .editor .row .field[type=date] { text-align: left; }
  .editor .btns { display: flex; gap: 8px; margin-top: 4px; }
  .editor .btns button { flex: 1; border: 1px solid var(--line); border-radius: 10px; padding: 11px; font-weight: 600; font-size: 13.5px; cursor: pointer; font-family: inherit; }
  .editor .save { background: var(--ink); color: var(--on-ink); border-color: var(--ink); }
  .editor .cancel { background: transparent; color: var(--text); }

  /* 추가 화면 */
  .type-seg { display: flex; gap: 5px; padding: 5px; background: var(--bg); border: 1px solid var(--line); border-radius: 13px; margin-bottom: 14px; }
  .type-seg button { flex: 1; border: none; background: transparent; color: var(--muted); font-weight: 600; font-size: 13.5px; padding: 11px; border-radius: 9px; cursor: pointer; font-family: inherit; letter-spacing: -0.01em; transition: background .15s ease, color .15s ease; }
  .type-seg button.active { background: var(--ink); color: var(--on-ink); }
  .add { display: flex; gap: 9px; }
  .add .field { flex: 1; padding: 14px 15px; font-size: 15px; border-radius: 12px; text-align: left; }
  .add button { border: none; background: var(--ink); color: var(--on-ink); font-weight: 600; border-radius: 12px; padding: 0 22px; font-size: 15px; cursor: pointer; font-family: inherit; }
  .add button:active { opacity: .88; }
  .opts { font-size: 13px; color: var(--muted); margin-top: 14px; line-height: 2.4; }
  .opts .field { width: 78px; padding: 7px 9px; font-size: 14px; text-align: right; }
  .deadline-row { display: flex; align-items: center; gap: 10px; margin-top: 14px; font-size: 13px; color: var(--muted); }
  .add-box { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 18px; box-shadow: var(--shadow); margin-top: 18px; }

  .empty { text-align: center; color: var(--muted); padding: 30px 10px; font-size: 14px; letter-spacing: -0.01em; }
  .foot { text-align: center; color: var(--faint); font-size: 11.5px; margin-top: 26px; line-height: 1.8; }

  /* 프로필 */
  .profile-head { display: flex; align-items: center; gap: 16px; margin: 22px 2px 24px; }
  .avatar { width: 60px; height: 60px; border-radius: 50%; background: var(--ink); color: var(--on-ink); display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 500; flex: 0 0 auto; }
  .profile-name { font-size: 20px; font-weight: 600; display: inline-flex; align-items: baseline; gap: 9px; cursor: pointer; letter-spacing: -0.02em; }
  .profile-name .edit { font-size: 11px; color: var(--muted); font-weight: 600; letter-spacing: 0.04em; }
  .profile-sub { font-size: 12.5px; color: var(--muted); margin-top: 4px; }
  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 11px; margin-bottom: 22px; }
  .tile { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px; box-shadow: var(--shadow); }
  .tile .t-n { font-size: 26px; font-weight: 500; letter-spacing: -0.03em; }
  .tile .t-l { font-size: 11.5px; color: var(--muted); margin-top: 4px; }
  .settings { border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  .settings > * + * { border-top: 1px solid var(--line); }
  .settings .set-row { display: flex; align-items: center; justify-content: space-between; padding: 15px 16px; font-size: 14px; }
  .settings .set-row .acc-val { color: var(--muted); font-size: 13px; }
  .settings .set-item { width: 100%; border: none; background: transparent; padding: 15px 16px; font-size: 14px; font-weight: 600; font-family: inherit; text-align: left; cursor: pointer; color: var(--text); }
  .settings .danger { width: 100%; border: none; background: transparent; padding: 15px 16px; font-size: 14px; font-weight: 600; font-family: inherit; text-align: left; cursor: pointer; color: var(--bad); }
  .settings .set-item:active, .settings .danger:active { background: color-mix(in srgb, var(--ink) 5%, transparent); }

  /* 프로필 편집 모달 */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 100; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .modal { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 22px; width: 100%; max-width: 340px; box-shadow: 0 12px 44px rgba(0,0,0,.28); }
  .modal h3 { margin: 0 0 18px; font-size: 16px; font-weight: 600; letter-spacing: -0.01em; text-align: center; }
  .modal-avatar { width: 88px; height: 88px; font-size: 34px; margin: 0 auto 16px; background-size: cover; background-position: center; }
  .modal-photo-btn { display: block; margin: 0 auto 16px; border: 1px solid var(--line); background: transparent; color: var(--text); border-radius: 10px; padding: 9px 16px; font-weight: 600; font-size: 13px; cursor: pointer; font-family: inherit; }
  .modal-photo-btn:active { background: color-mix(in srgb, var(--ink) 5%, transparent); }
  .avatar-colors { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-bottom: 18px; }
  .color-dot { width: 34px; height: 34px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; padding: 0; box-shadow: inset 0 0 0 2px var(--card); }
  .color-dot.sel { border-color: var(--ink); }
  .modal .field { width: 100%; text-align: left; margin-bottom: 18px; padding: 12px 14px; font-size: 15px; }
  .modal-btns { display: flex; gap: 8px; }
  .modal-btns button { flex: 1; border: 1px solid var(--line); border-radius: 10px; padding: 12px; font-weight: 600; font-size: 14px; cursor: pointer; font-family: inherit; }
  .modal-btns .save { background: var(--ink); color: var(--on-ink); border-color: var(--ink); }
  .modal-btns .cancel { background: transparent; color: var(--text); }

  /* 로그인 / 가입 */
  #authWrap { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; max-width: 380px; margin: 0 auto; padding: 40px 24px calc(40px + env(safe-area-inset-bottom)); }
  .auth-brand { text-align: center; margin-bottom: 38px; }
  .auth-brand h1 { font-size: 34px; font-weight: 600; letter-spacing: -0.03em; margin: 0; }
  .auth-input { width: 100%; border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 12px; padding: 14px 15px; font-size: 15px; font-family: inherit; outline: none; margin-bottom: 10px; transition: border-color .15s ease; }
  .auth-input:focus { border-color: var(--ink); }
  .auth-error { color: var(--bad); font-size: 12.5px; margin: 2px 2px 12px; min-height: 15px; }
  .auth-primary { width: 100%; border: none; background: var(--ink); color: var(--on-ink); border-radius: 12px; padding: 15px; font-weight: 600; font-size: 15px; cursor: pointer; font-family: inherit; }
  .auth-primary:active { opacity: .9; }
  .auth-switch { text-align: center; font-size: 13px; color: var(--muted); margin-top: 18px; }
  .auth-switch a { color: var(--ink); font-weight: 600; cursor: pointer; }
  .auth-divider { display: flex; align-items: center; gap: 12px; margin: 24px 0 16px; color: var(--faint); font-size: 11px; letter-spacing: 0.06em; }
  .auth-divider::before, .auth-divider::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .auth-guest { width: 100%; border: 1px solid var(--line); background: transparent; color: var(--text); border-radius: 12px; padding: 14px; font-weight: 600; font-size: 14px; cursor: pointer; font-family: inherit; }
  .auth-guest:active { background: color-mix(in srgb, var(--ink) 5%, transparent); }

  /* 하단 탭바 */
  .tabbar { position: fixed; left: 0; right: 0; bottom: 0; background: color-mix(in srgb, var(--card) 88%, transparent);
    backdrop-filter: saturate(180%) blur(14px); -webkit-backdrop-filter: saturate(180%) blur(14px);
    border-top: 1px solid var(--line); z-index: 50; padding-bottom: env(safe-area-inset-bottom); }
  .tabbar-inner { max-width: 540px; margin: 0 auto; display: flex; align-items: center; justify-content: space-around; padding: 9px 24px; }
  .tabbar .tab { flex: 1; border: none; background: transparent; color: var(--faint); font-family: inherit; font-size: 10.5px; font-weight: 600;
    cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0; letter-spacing: 0.03em; transition: color .15s ease; }
  .tabbar .tab.active { color: var(--accent); }
  .tabbar .fab { flex: 0 0 auto; background: var(--accent); color: #fff; width: 50px; height: 50px; border: none; border-radius: 50%;
    cursor: pointer; margin-top: -14px; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 18px rgba(74,144,226,.34); transition: transform .1s ease; }
  .tabbar .fab .icon { width: 22px; height: 22px; stroke-width: 1.6; }
  .tabbar .fab:active { transform: scale(0.93); }
</style>
</head>
<body>
<div id="authWrap" style="display:none">
  <div id="authBody"></div>
</div>
<div class="wrap" style="display:none">

  <!-- ==================== 홈 ==================== -->

  function renderAvoidCard(task) {

    var within = st.slipsThisWeek <= nums.limit;

    else if (task.deadline && st.daysLeft > 0) badge = badgeEl("ink", "D-" + st.daysLeft);

    var rt = nums.limit > 0 ? "주 " + nums.limit + "회까지 허용 · 초과 1회 −" + won(nums.penalty) : "어길 때마다 −" + won(nums.penalty);

    var box = document.createElement("div"); box.className = "editor";

      var d = doNums(task);

      box.appendChild(editRow("주 목표 횟수", inputs.goal, "회"));

      box.appendChild(editRow("목표 미달 벌금", inputs.penalty, "원"));
    } else {
      var a = avNums(task);
      inputs.deadline = document.createElement("input"); inputs.deadline.type = "date"; inputs.deadline.className = "field"; inputs.deadline.value = task.deadline || "";
      inputs.limit = numField(a.limit, 0, 1); inputs.penalty = numField(a.penalty, 0, 1000); inputs.reward = numField(a.reward, 0, 100);
      box.appendChild(editRow("언제까지", inputs.deadline, ""));
      box.appendChild(editRow("주 허용 횟수", inputs.limit, "회"));
      box.appendChild(editRow("초과 1회당 벌금", inputs.penalty, "원"));
      box.appendChild(editRow("잘 지키면 보상", inputs.reward, "원"));
    }
    var btns = document.createElement("div"); btns.className = "btns";
    var saveBtn = document.createElement("button"); saveBtn.className = "save"; saveBtn.textContent = "저장";
    saveBtn.onclick = function () {
      if (isDateDo(task)) {
        if (inputs.due.value) task.due = inputs.due.value;
        task.reward = Math.max(0, n(inputs.reward.value, DEF.doReward));
        task.penalty = Math.max(0, n(inputs.penalty.value, DEF.doPenalty));
      } else if (type === "do") {
        task.goal = Math.max(1, Math.round(n(inputs.goal.value, DEF.doGoal)));
        task.reward = Math.max(0, n(inputs.reward.value, DEF.doReward));
        task.penalty = Math.max(0, n(inputs.penalty.value, DEF.doPenalty));
      } else {
        task.deadline = inputs.deadline.value || null;
        task.limit = Math.max(0, Math.round(n(inputs.limit.value, DEF.avLimit)));
        task.penalty = Math.max(0, n(inputs.penalty.value, DEF.avPenalty));
        task.reward = Math.max(0, n(inputs.reward.value, DEF.avReward));

    };
    var cancelBtn = document.createElement("button"); cancelBtn.className = "cancel"; cancelBtn.textContent = "취소";
    cancelBtn.onclick = function () { openEditor = null; render(); };
    btns.appendChild(saveBtn); btns.appendChild(cancelBtn); box.appendChild(btns);
    return box;
  }

  // ---------- 프로필 ----------

  var AVATAR_COLORS = ["#3b4757", "#4a90e2", "#2f8f6b", "#d1573f", "#7a5cc0", "#e0983a", "#3aa0a0", "#8a6d5a"];
  function applyAvatar(el, profile) {

    if (a && a.type === "photo" && a.data) {
      el.textContent = "";
      el.style.backgroundImage = "url(" + a.data + ")";

      el.style.color = "";
    } else {
      el.style.backgroundImage = "";

  function downscaleImage(file, cb) {
    var reader = new FileReader();
    reader.onload = function () {
      var img = new Image();
      img.onload = function () {
        var size = 200, canvas = document.createElement("canvas"); canvas.width = size; canvas.height = size;
        var ctx = canvas.getContext("2d");
        var s = Math.min(img.width, img.height), sx = (img.width - s) / 2, sy = (img.height - s) / 2;
        ctx.drawImage(img, sx, sy, s, s, 0, 0, size, size);
        try { cb(canvas.toDataURL("image/jpeg", 0.82)); } catch (e) { alert("이미지를 불러오지 못했어요."); }
      };
      img.onerror = function () { alert("이미지를 불러오지 못했어요."); };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  }
  function openProfileEditor() {

    var preview = document.createElement("div"); preview.className = "avatar modal-avatar";
    function refresh() { applyAvatar(preview, draft); dots.forEach(function (d) { d.el.classList.toggle("sel", draft.avatar && draft.avatar.type === "color" && draft.avatar.color === d.col); }); }
    modal.appendChild(preview);

    var fileInput = document.createElement("input"); fileInput.type = "file"; fileInput.accept = "image/*"; fileInput.style.display = "none";
    fileInput.onchange = function () { var f = fileInput.files && fileInput.files[0]; if (!f) return; downscaleImage(f, function (url) { draft.avatar = { type: "photo", data: url }; refresh(); }); };
    var photoBtn = document.createElement("button"); photoBtn.className = "modal-photo-btn"; photoBtn.textContent = "내 사진 선택";
    photoBtn.onclick = function () { fileInput.click(); };

    var colorsWrap = document.createElement("div"); colorsWrap.className = "avatar-colors";

      var dot = document.createElement("button"); dot.className = "color-dot"; dot.style.background = col; dot.title = "기본 컬러";
      dot.onclick = (function (c) { return function () { draft.avatar = { type: "color", color: c }; refresh(); }; })(col);
      dots.push({ el: dot, col: col }); colorsWrap.appendChild(dot);
    });
    modal.appendChild(colorsWrap);

    var nameField = document.createElement("input"); nameField.className = "field"; nameField.type = "text"; nameField.maxLength = 20; nameField.value = draft.name; nameField.placeholder = "닉네임";
    nameField.oninput = function () { draft.name = nameField.value; applyAvatar(preview, draft); };
    modal.appendChild(nameField);

    var btns = document.createElement("div"); btns.className = "modal-btns";

    btns.appendChild(cancel); btns.appendChild(saveB); modal.appendChild(btns);

    overlay.appendChild(modal); document.body.appendChild(overlay);
    refresh(); nameField.focus();
  }

  var doDateOpts = document.getElementById("doDateOpts");
  var evDateRow = document.getElementById("evDateRow");
  var avOpts = document.getElementById("avOpts");
  function updateAddVisibility() {
    var isDo = currentType === "do";
    var avoid = currentType === "avoid";
    var isEvent = currentType === "event";
    var dateMode = isDo && currentDoMode === "date";
    doModeSeg.style.display = isDo ? "flex" : "none";
    doOpts.style.display = (isDo && currentDoMode === "week") ? "block" : "none";
    doDateRow.style.display = dateMode ? "flex" : "none";
    doDateOpts.style.display = dateMode ? "block" : "none";
    deadlineRow.style.display = avoid ? "flex" : "none";
    avOpts.style.display = avoid ? "block" : "none";
    evDateRow.style.display = isEvent ? "flex" : "none";
    input.placeholder = avoid ? "예: 야식 먹기" : isEvent ? "예: 오후 3시 미팅" : (dateMode ? "예: 건강검진 받기" : "예: 헬스장 가기");
  }
  typeSeg.querySelectorAll("button").forEach(function (b) {
    b.onclick = function () {
      currentType = b.getAttribute("data-type");
      typeSeg.querySelectorAll("button").forEach(function (x) { x.classList.remove("active"); });
      b.classList.add("active");
      updateAddVisibility();
    };
  });
  doModeSeg.querySelectorAll("button").forEach(function (b) {
    b.onclick = function () {
      currentDoMode = b.getAttribute("data-mode");
      doModeSeg.querySelectorAll("button").forEach(function (x) { x.classList.remove("active"); });
      b.classList.add("active");
      updateAddVisibility();
    };
  });
  function addTask() {
    var v = input.value.trim();
    if (!v) { input.focus(); return; }
    if (currentType === "event") {
      var ed = document.getElementById("evDateInput").value;
      if (!ed) { alert("날짜를 선택하세요."); return; }
      input.value = ""; document.getElementById("evDateInput").value = "";
      selectedDate = ed; var pd = parseYmd(ed); calCursor = { y: pd.getFullYear(), m: pd.getMonth() };
      addEvent(ed, v);
      showTab("home");
      return;
    }
    var today = ymd(stripTime(new Date()));
    var task = { id: uid(), name: v, type: currentType, created: today };
    if (currentType === "avoid") {
      task.slips = {};
      task.deadline = document.getElementById("deadlineInput").value || null;
      task.limit = Math.max(0, Math.round(n(document.getElementById("avLimit").value, DEF.avLimit)));
      task.penalty = Math.max(0, n(document.getElementById("avPenalty").value, DEF.avPenalty));
      task.reward = Math.max(0, n(document.getElementById("avReward").value, DEF.avReward));
    } else if (currentDoMode === "date") {
      var due = document.getElementById("doDueInput").value;
      if (!due) { alert("목표 날짜를 선택하세요."); return; }
      task.mode = "date"; task.due = due; task.done = false;
      task.reward = Math.max(0, n(document.getElementById("doDateReward").value, DEF.doReward));
      task.penalty = Math.max(0, n(document.getElementById("doDatePenalty").value, DEF.doPenalty));
    } else {
      task.log = {};
      task.goal = Math.max(1, Math.round(n(document.getElementById("doGoal").value, DEF.doGoal)));
      task.reward = Math.max(0, n(document.getElementById("doReward").value, DEF.doReward));
      task.penalty = Math.max(0, n(document.getElementById("doPenalty").value, DEF.doPenalty));
    }
    state.tasks.push(task);
    input.value = ""; document.getElementById("deadlineInput").value = ""; document.getElementById("doDueInput").value = "";
    save(); showTab("home");
  }
  document.getElementById("addBtn").onclick = addTask;
  input.addEventListener("keydown", function (e) { if (e.key === "Enter") addTask(); });
  document.getElementById("settleToggle").onclick = function () { settleMode = (settleMode === "current") ? "projected" : "current"; render(); };
  updateAddVisibility();
  document.querySelectorAll(".tabbar [data-tab]").forEach(function (b) {
    b.onclick = function () {
      var tab = b.getAttribute("data-tab");
      if (tab === "home") { var t = stripTime(new Date()); calCursor = { y: t.getFullYear(), m: t.getMonth() }; selectedDate = ymd(t); }
      showTab(tab);
    };
  });

  session = loadSession();
  if (session && (session.type === "user" || session.type === "guest")) enterApp(session);
  else showAuth("login");
})();
</script>
</body>
</html>
