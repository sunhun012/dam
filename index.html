<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>다짐</title>
<style>
  :root {
    --bg: #f6f5f2; --card: #ffffff; --ink: #1a1a1e; --on-ink: #ffffff; --text: #1a1a1e;
    --muted: #93918b; --faint: #b9b6ae; --line: #e7e4dd;
    --good: #2f6a4f; --bad: #a63e2c; --good-bg: #eef3ef; --bad-bg: #f6ece8; --shadow: 0 1px 2px rgba(20,20,20,.03);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121211; --card: #1a1a18; --ink: #efece4; --on-ink: #16150f; --text: #ece9e1;
      --muted: #8b8981; --faint: #63615a; --line: #2c2b27;
      --good: #82b49a; --bad: #d18b78; --good-bg: #18251f; --bad-bg: #281a15; --shadow: none;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    line-height: 1.55; padding: 0 20px calc(104px + env(safe-area-inset-bottom));
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; font-variant-numeric: tabular-nums;
  }
  .wrap { max-width: 540px; margin: 0 auto; }
  .icon { width: 19px; height: 19px; display: block; stroke: currentColor; fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .ic-wrap { display: inline-flex; }

  header { padding: 32px 2px 6px; }
  h1 { font-size: 21px; font-weight: 600; margin: 0; letter-spacing: -0.02em; }
  .sub { color: var(--muted); font-size: 13px; margin: 5px 0 0; letter-spacing: -0.01em; }
  .overline { font-size: 11px; color: var(--muted); font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; }

  /* 요약 */
  .summary { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 22px; box-shadow: var(--shadow); margin: 20px 0; }
  .settle-amt { font-size: 42px; font-weight: 500; letter-spacing: -0.035em; margin: 10px 0 2px; line-height: 1; }
  .settle-amt.pos { color: var(--good); }
  .settle-amt.neg { color: var(--bad); }
  .settle-cap { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 10px; }
  .settle-toggle { border: 1px solid var(--line); background: transparent; color: var(--muted); font-family: inherit; font-size: 11px; font-weight: 600; padding: 3px 10px; border-radius: 999px; cursor: pointer; letter-spacing: -0.01em; }
  .settle-toggle:active { background: color-mix(in srgb, var(--ink) 6%, transparent); }
  .stat-row { display: flex; margin-top: 20px; border-top: 1px solid var(--line); padding-top: 16px; }
  .stat { flex: 1; display: flex; flex-direction: column; gap: 5px; padding: 0 14px; }
  .stat:first-child { padding-left: 0; }
  .stat:not(:first-child) { border-left: 1px solid var(--line); }
  .stat .s-l { font-size: 11px; color: var(--muted); }
  .stat .s-v { font-size: 16px; font-weight: 700; letter-spacing: -0.01em; }
  .stat .s-v.good { color: var(--good); }
  .stat .s-v.bad { color: var(--bad); }

  /* 다가오는 마감 */
  .deadline-alert { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px 18px; box-shadow: var(--shadow); margin-bottom: 16px; }
  .deadline-alert .overline { display: block; margin-bottom: 6px; }
  .dl-item { display: flex; align-items: center; gap: 13px; padding: 10px 0; cursor: pointer; }
  .dl-item + .dl-item { border-top: 1px solid var(--line); }
  .dl-item:active { opacity: .6; }
  .dl-dday { font-size: 14px; font-weight: 700; letter-spacing: -0.02em; min-width: 48px; }
  .dl-dday.soon { color: var(--bad); }
  .dl-body { flex: 1; min-width: 0; }
  .dl-name { font-size: 14.5px; font-weight: 600; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dl-sub { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
  .dl-date { font-size: 12px; color: var(--muted); flex: 0 0 auto; }

  /* 달력 */
  .calendar { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 18px; box-shadow: var(--shadow); }
  .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .cal-title { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
  .cal-nav { display: flex; gap: 2px; }
  .cal-nav button { border: none; background: transparent; color: var(--muted); cursor: pointer; padding: 6px; border-radius: 8px; line-height: 0; display: inline-flex; }
  .cal-nav button:hover { color: var(--ink); }
  .cal-dow { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-bottom: 8px; }
  .cal-dow span { text-align: center; font-size: 10.5px; color: var(--muted); font-weight: 600; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cal-day { aspect-ratio: 1/1; border: 1px solid transparent; border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; cursor: pointer; transition: background .12s ease, border-color .12s ease; }
  .cal-day.blank { cursor: default; }
  .cal-day .d-num { font-size: 13px; font-weight: 500; }
  .cal-day.future .d-num { color: var(--faint); }
  .cal-day.today { border-color: var(--ink); }
  .cal-day.selected { background: color-mix(in srgb, var(--ink) 9%, transparent); border-color: var(--ink); }
  .cal-day:not(.blank):not(.selected):active { transform: scale(0.94); }
  .cal-dots { display: flex; gap: 3px; height: 5px; align-items: center; }
  .cal-dot { width: 4px; height: 4px; border-radius: 50%; }
  .cal-dot.done { background: var(--ink); }
  .cal-dot.slip { background: var(--bad); }
  .cal-dot.deadline { width: 6px; height: 6px; background: transparent; border: 1.5px solid var(--ink); box-sizing: border-box; }
  .cal-dot.event { background: var(--muted); }
  .cal-day.deadline-day { border-color: var(--ink); border-style: dashed; }
  .cal-day.deadline-day.selected, .cal-day.deadline-day.today { border-style: solid; }
  .cal-legend { display: flex; gap: 18px; justify-content: center; flex-wrap: wrap; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); }
  .cal-legend span { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); font-weight: 600; }
  .cal-legend .cal-dot { width: 5px; height: 5px; }
  .cal-legend .cal-dot.deadline { width: 7px; height: 7px; }

  /* 선택한 날 */
  .dd-head { display: flex; align-items: baseline; gap: 9px; margin: 24px 2px 14px; }
  .dd-date { font-size: 16px; font-weight: 600; letter-spacing: -0.01em; }
  .dd-today { font-size: 11px; color: var(--muted); font-weight: 600; letter-spacing: 0.03em; border: 1px solid var(--line); padding: 2px 8px; border-radius: 999px; }
  .section-title { font-size: 11px; font-weight: 600; color: var(--muted); margin: 22px 2px 12px; letter-spacing: 0.09em; text-transform: uppercase; }

  /* 이 날 할 일 (일정) */
  .ev-row { display: flex; align-items: center; gap: 11px; padding: 9px 0; }
  .ev-row + .ev-row { border-top: 1px solid var(--line); }
  .ev-check { flex: 0 0 auto; width: 22px; height: 22px; border: 1.5px solid var(--line); border-radius: 7px; background: transparent; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; padding: 0; color: var(--on-ink); }
  .ev-check.on { background: var(--ink); border-color: var(--ink); }
  .ev-check .icon { width: 14px; height: 14px; stroke-width: 2.4; }
  .ev-text { flex: 1; font-size: 14.5px; letter-spacing: -0.01em; word-break: break-word; }
  .ev-text.done { color: var(--muted); text-decoration: line-through; }

  /* 카드 */
  .task { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 18px; box-shadow: var(--shadow); margin-bottom: 12px; }
  .task-top { display: flex; align-items: center; gap: 8px; margin-bottom: 15px; }
  .task-name { font-size: 16px; font-weight: 600; flex: 1; letter-spacing: -0.01em; }
  .badge { font-size: 11px; font-weight: 600; letter-spacing: 0.04em; white-space: nowrap; color: var(--muted); }
  .badge.good { color: var(--good); }
  .badge.bad { color: var(--bad); }
  .badge.ink { color: var(--ink); }
  .icon-btn { border: none; background: transparent; color: var(--faint); cursor: pointer; padding: 4px; border-radius: 8px; line-height: 0; display: inline-flex; }
  .icon-btn:hover { color: var(--ink); }
  .icon-btn.del:hover { color: var(--bad); }

  .progress { height: 4px; background: var(--line); border-radius: 999px; overflow: hidden; margin-bottom: 15px; }
  .progress > span { display: block; height: 100%; background: var(--ink); border-radius: 999px; transition: width .3s ease; }
  .progress.done > span { background: var(--good); }

  .status-line { font-size: 13.5px; font-weight: 600; margin-bottom: 3px; letter-spacing: -0.01em; }
  .status-sub { font-size: 12px; color: var(--muted); margin-bottom: 15px; }
  .rule-line { font-size: 11.5px; color: var(--muted); margin-top: 15px; }

  .day-toggle { width: 100%; border: 1px solid var(--line); background: transparent; color: var(--text); border-radius: 11px; padding: 12px; font-weight: 600; font-size: 13.5px; cursor: pointer; font-family: inherit; letter-spacing: -0.01em; transition: background .15s ease, border-color .15s ease; }
  .day-toggle.on { background: var(--ink); color: var(--on-ink); border-color: var(--ink); }
  .day-toggle:disabled { opacity: .4; cursor: not-allowed; }
  .day-toggle:not(:disabled):active { transform: scale(0.99); }
  .sel-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .sel-cnt { font-size: 13.5px; font-weight: 600; letter-spacing: -0.01em; }
  .sel-btns { display: flex; gap: 8px; }
  .sel-btns button { border: 1px solid var(--line); background: transparent; border-radius: 9px; padding: 8px 13px; font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit; color: var(--text); }
  .sel-btns .add { color: var(--bad); }
  .sel-btns button:disabled { opacity: .4; cursor: not-allowed; }

  .editor { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 11px; }
  .editor .row { display: flex; align-items: center; justify-content: space-between; font-size: 13px; color: var(--text); gap: 10px; }
  .field { border: 1px solid var(--line); background: var(--bg); color: var(--text); border-radius: 9px; padding: 8px 11px; font-size: 14px; font-family: inherit; outline: none; transition: border-color .15s ease; }
  .field:focus { border-color: var(--ink); }
  .editor .row .field { width: 130px; text-align: right; }
  .editor .row .field[type=date] { text-align: left; }
  .editor .btns { display: flex; gap: 8px; margin-top: 4px; }
  .editor .btns button { flex: 1; border: 1px solid var(--line); border-radius: 10px; padding: 11px; font-weight: 600; font-size: 13.5px; cursor: pointer; font-family: inherit; }
  .editor .save { background: var(--ink); color: var(--on-ink); border-color: var(--ink); }
  .editor .cancel { background: transparent; color: var(--text); }

  /* 추가 화면 */
  .type-seg { display: flex; gap: 5px; padding: 5px; background: var(--bg); border: 1px solid var(--line); border-radius: 13px; margin-bottom: 14px; }
  .type-seg button { flex: 1; border: none; background: transparent; color: var(--muted); font-weight: 600; font-size: 13.5px; padding: 11px; border-radius: 9px; cursor: pointer; font-family: inherit; letter-spacing: -0.01em; transition: background .15s ease, color .15s ease; }
  .type-seg button.active { background: var(--ink); color: var(--on-ink); }
  .add { display: flex; gap: 9px; }
  .add .field { flex: 1; padding: 14px 15px; font-size: 15px; border-radius: 12px; text-align: left; }
  .add button { border: none; background: var(--ink); color: var(--on-ink); font-weight: 600; border-radius: 12px; padding: 0 22px; font-size: 15px; cursor: pointer; font-family: inherit; }
  .add button:active { opacity: .88; }
  .opts { font-size: 13px; color: var(--muted); margin-top: 14px; line-height: 2.4; }
  .opts .field { width: 78px; padding: 7px 9px; font-size: 14px; text-align: right; }
  .deadline-row { display: flex; align-items: center; gap: 10px; margin-top: 14px; font-size: 13px; color: var(--muted); }
  .add-box { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 18px; box-shadow: var(--shadow); margin-top: 18px; }

  .empty { text-align: center; color: var(--muted); padding: 30px 10px; font-size: 14px; letter-spacing: -0.01em; }
  .foot { text-align: center; color: var(--faint); font-size: 11.5px; margin-top: 26px; line-height: 1.8; }

  /* 프로필 */
  .profile-head { display: flex; align-items: center; gap: 16px; margin: 22px 2px 24px; }
  .avatar { width: 60px; height: 60px; border-radius: 50%; background: var(--ink); color: var(--on-ink); display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 500; flex: 0 0 auto; }
  .profile-name { font-size: 20px; font-weight: 600; display: inline-flex; align-items: baseline; gap: 9px; cursor: pointer; letter-spacing: -0.02em; }
  .profile-name .edit { font-size: 11px; color: var(--muted); font-weight: 600; letter-spacing: 0.04em; }
  .profile-sub { font-size: 12.5px; color: var(--muted); margin-top: 4px; }
  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 11px; margin-bottom: 22px; }
  .tile { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px; box-shadow: var(--shadow); }
  .tile .t-n { font-size: 26px; font-weight: 500; letter-spacing: -0.03em; }
  .tile .t-l { font-size: 11.5px; color: var(--muted); margin-top: 4px; }
  .settings { border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  .settings > * + * { border-top: 1px solid var(--line); }
  .settings .set-row { display: flex; align-items: center; justify-content: space-between; padding: 15px 16px; font-size: 14px; }
  .settings .set-row .acc-val { color: var(--muted); font-size: 13px; }
  .settings .set-item { width: 100%; border: none; background: transparent; padding: 15px 16px; font-size: 14px; font-weight: 600; font-family: inherit; text-align: left; cursor: pointer; color: var(--text); }
  .settings .danger { width: 100%; border: none; background: transparent; padding: 15px 16px; font-size: 14px; font-weight: 600; font-family: inherit; text-align: left; cursor: pointer; color: var(--bad); }
  .settings .set-item:active, .settings .danger:active { background: color-mix(in srgb, var(--ink) 5%, transparent); }

  /* 로그인 / 가입 */
  #authWrap { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; max-width: 380px; margin: 0 auto; padding: 40px 24px calc(40px + env(safe-area-inset-bottom)); }
  .auth-brand { text-align: center; margin-bottom: 38px; }
  .auth-brand h1 { font-size: 34px; font-weight: 600; letter-spacing: -0.03em; margin: 0; }
  .auth-input { width: 100%; border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 12px; padding: 14px 15px; font-size: 15px; font-family: inherit; outline: none; margin-bottom: 10px; transition: border-color .15s ease; }
  .auth-input:focus { border-color: var(--ink); }
  .auth-error { color: var(--bad); font-size: 12.5px; margin: 2px 2px 12px; min-height: 15px; }
  .auth-primary { width: 100%; border: none; background: var(--ink); color: var(--on-ink); border-radius: 12px; padding: 15px; font-weight: 600; font-size: 15px; cursor: pointer; font-family: inherit; }
  .auth-primary:active { opacity: .9; }
  .auth-switch { text-align: center; font-size: 13px; color: var(--muted); margin-top: 18px; }
  .auth-switch a { color: var(--ink); font-weight: 600; cursor: pointer; }
  .auth-divider { display: flex; align-items: center; gap: 12px; margin: 24px 0 16px; color: var(--faint); font-size: 11px; letter-spacing: 0.06em; }
  .auth-divider::before, .auth-divider::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .auth-guest { width: 100%; border: 1px solid var(--line); background: transparent; color: var(--text); border-radius: 12px; padding: 14px; font-weight: 600; font-size: 14px; cursor: pointer; font-family: inherit; }
  .auth-guest:active { background: color-mix(in srgb, var(--ink) 5%, transparent); }

  /* 하단 탭바 */
  .tabbar { position: fixed; left: 0; right: 0; bottom: 0; background: color-mix(in srgb, var(--card) 88%, transparent);
    backdrop-filter: saturate(180%) blur(14px); -webkit-backdrop-filter: saturate(180%) blur(14px);
    border-top: 1px solid var(--line); z-index: 50; padding-bottom: env(safe-area-inset-bottom); }
  .tabbar-inner { max-width: 540px; margin: 0 auto; display: flex; align-items: center; justify-content: space-around; padding: 9px 24px; }
  .tabbar .tab { flex: 1; border: none; background: transparent; color: var(--faint); font-family: inherit; font-size: 10.5px; font-weight: 600;
    cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0; letter-spacing: 0.03em; transition: color .15s ease; }
  .tabbar .tab.active { color: var(--ink); }
  .tabbar .fab { flex: 0 0 auto; background: var(--ink); color: var(--on-ink); width: 50px; height: 50px; border: none; border-radius: 50%;
    cursor: pointer; margin-top: -14px; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 18px rgba(20,20,20,.16); transition: transform .1s ease; }
  .tabbar .fab .icon { width: 22px; height: 22px; stroke-width: 1.6; }
  .tabbar .fab:active { transform: scale(0.93); }
</style>
</head>
<body>
<div id="authWrap" style="display:none">
  <div id="authBody"></div>
</div>
<div class="wrap" style="display:none">

  <!-- ==================== 홈 ==================== -->
  <div id="screen-home" class="screen">
    <header>
      <h1>다짐</h1>
    </header>

    <div class="summary">
      <div class="overline" id="ovLabel">이번 주</div>
      <div class="settle-amt pos" id="homeSettle">0원</div>
      <div class="settle-cap">
        <span id="settleCap">현재 정산</span>
        <button id="settleToggle" class="settle-toggle">예상 보기</button>
      </div>
      <div class="stat-row">
        <div class="stat"><span class="s-l">번 돈</span><span class="s-v good" id="homeEarn">+0원</span></div>
        <div class="stat"><span class="s-l" id="fineLabel">벌금</span><span class="s-v bad" id="homeFine">−0원</span></div>
        <div class="stat"><span class="s-l">완료</span><span class="s-v" id="homeCount">0회</span></div>
      </div>
    </div>

    <div id="deadlineAlert"></div>
    <div id="calendar"></div>
    <div id="dayDetail"></div>

    <p class="foot">날짜를 눌러 그날의 기록을 남기세요 · 주는 월요일 시작</p>
  </div>

  <!-- ==================== 추가 ==================== -->
  <div id="screen-add" class="screen" style="display:none">
    <header>
      <h1>새 항목</h1>
      <p class="sub">무엇을 추가할지 고르세요.</p>
    </header>
    <div class="add-box">
      <div class="type-seg" id="typeSeg">
        <button data-type="do" class="active">해야 할 일</button>
        <button data-type="avoid">하지 말 일</button>
        <button data-type="event">이 날 할 일</button>
      </div>
      <div class="add">
        <input id="taskInput" class="field" type="text" placeholder="예: 헬스장 가기" maxlength="30" />
        <button id="addBtn">추가</button>
      </div>
      <div class="type-seg" id="doModeSeg">
        <button data-mode="week" class="active">주 반복</button>
        <button data-mode="date">날짜 지정</button>
      </div>
      <div class="opts" id="doOpts">
        주 <input type="number" class="field" id="doGoal" value="5" min="1" step="1" inputmode="numeric" />회 ·
        회당 +<input type="number" class="field" id="doReward" value="500" min="0" step="100" inputmode="numeric" />원 ·
        미달 −<input type="number" class="field" id="doPenalty" value="10000" min="0" step="1000" inputmode="numeric" />원
      </div>
      <div class="deadline-row" id="doDateRow" style="display:none">
        <label>언제까지</label>
        <input type="date" class="field" id="doDueInput" />
      </div>
      <div class="opts" id="doDateOpts" style="display:none">
        완료 +<input type="number" class="field" id="doDateReward" value="500" min="0" step="100" inputmode="numeric" />원 ·
        미완료 −<input type="number" class="field" id="doDatePenalty" value="10000" min="0" step="1000" inputmode="numeric" />원
      </div>
      <div class="deadline-row" id="evDateRow" style="display:none">
        <label>언제</label>
        <input type="date" class="field" id="evDateInput" />
        <span style="color:var(--faint)">그날 할 일로 달력에 표시</span>
      </div>
      <div class="deadline-row" id="deadlineRow" style="display:none">
        <label>언제까지</label>
        <input type="date" class="field" id="deadlineInput" />
        <span style="color:var(--faint)">비우면 계속</span>
      </div>
      <div class="opts" id="avOpts" style="display:none">
        주 <input type="number" class="field" id="avLimit" value="0" min="0" step="1" inputmode="numeric" />회 허용 ·
        초과 −<input type="number" class="field" id="avPenalty" value="10000" min="0" step="1000" inputmode="numeric" />원 ·
        지키면 +<input type="number" class="field" id="avReward" value="0" min="0" step="100" inputmode="numeric" />원

<script>
(function () {
  "use strict";

  var DATA_PREFIX = "yaks0k-piggy-v1";
  var ACCT_KEY = "dajim-accounts";
  var SESS_KEY = "dajim-session";
  var currentDataKey = DATA_PREFIX;
  var session = null;
  var DOW = ["월", "화", "수", "목", "금", "토", "일"];
  var DEF = { doReward: 500, doGoal: 5, doPenalty: 10000, avPenalty: 10000, avLimit: 0, avReward: 0 };
  var ICONS = {
    settings: '<svg class="icon" viewBox="0 0 24 24"><circle cx="8" cy="8" r="2.1"/><path d="M11 8h9"/><path d="M4 8h1"/><circle cx="16" cy="16" r="2.1"/><path d="M4 16h9"/><path d="M19 16h1"/></svg>',
    close: '<svg class="icon" viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg>',
    chevL: '<svg class="icon" viewBox="0 0 24 24"><path d="M14.5 6l-6 6 6 6"/></svg>',
    chevR: '<svg class="icon" viewBox="0 0 24 24"><path d="M9.5 6l6 6-6 6"/></svg>',
    check: '<svg class="icon" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/></svg>'
  };
  function icon(name) { var s = document.createElement("span"); s.className = "ic-wrap"; s.innerHTML = ICONS[name]; return s; }

  // ---------- 유틸 ----------
  function ymd(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
  function parseYmd(s) { var p = String(s).split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function stripTime(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
  function mondayOf(d) { var x = stripTime(d); var day = (x.getDay() + 6) % 7; x.setDate(x.getDate() - day); return x; }
  function weekDates(ref) { var mon = mondayOf(ref), arr = []; for (var i = 0; i < 7; i++) { var d = new Date(mon); d.setDate(mon.getDate() + i); arr.push(d); } return arr; }
  function won(v) { return Math.abs(v).toLocaleString("ko-KR") + "원"; }
  function n(v, def) { var x = Number(v); return isFinite(x) ? x : def; }
  function load() { try { var raw = localStorage.getItem(currentDataKey); if (raw) return JSON.parse(raw); } catch (e) {} return { tasks: [] }; }
  function save() { try { localStorage.setItem(currentDataKey, JSON.stringify(state)); } catch (e) {} }
  function loadAccounts() { try { return JSON.parse(localStorage.getItem(ACCT_KEY)) || {}; } catch (e) { return {}; } }
  function saveAccounts(a) { try { localStorage.setItem(ACCT_KEY, JSON.stringify(a)); } catch (e) {} }
  function loadSession() { try { return JSON.parse(localStorage.getItem(SESS_KEY)); } catch (e) { return null; } }
  function saveSession() { try { localStorage.setItem(SESS_KEY, JSON.stringify(session)); } catch (e) {} }
  function dataKeyFor(s) { return s.type === "guest" ? DATA_PREFIX : DATA_PREFIX + "::" + s.email; }
  function validEmail(e) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e); }
  function uid() { return "t" + Math.random().toString(36).slice(2, 9); }
  function doNums(t) { return { goal: Math.max(1, Math.round(n(t.goal, DEF.doGoal))), reward: Math.max(0, n(t.reward, DEF.doReward)), penalty: Math.max(0, n(t.penalty, DEF.doPenalty)) }; }
  function avNums(t) { return { limit: Math.max(0, Math.round(n(t.limit, DEF.avLimit))), penalty: Math.max(0, n(t.penalty, DEF.avPenalty)), reward: Math.max(0, n(t.reward, DEF.avReward)) }; }

  var state = { tasks: [] };
  var currentType = "do";
  var currentDoMode = "week";
  var settleMode = "current";
  var openEditor = null;
  var _now = new Date();
  var calCursor = { y: _now.getFullYear(), m: _now.getMonth() };
  var selectedDate = ymd(stripTime(_now));

  // ---------- 상태 계산 ----------
  function isDateDo(t) { return (t.type || "do") === "do" && t.mode === "date"; }
  function sameWeek(d, ref) { return mondayOf(d).getTime() === mondayOf(ref).getTime(); }
  function dueDoStatus(task) {
    var today = stripTime(new Date()), due = parseYmd(task.due);
    var daysLeft = Math.round((due - today) / 86400000);
    return { due: task.due, daysLeft: daysLeft, done: !!task.done, overdue: !task.done && daysLeft < 0, dueThisWeek: sameWeek(due, today) };
  }
  function doStatus(task) {
    var goal = doNums(task).goal;
    var today = stripTime(new Date()), days = weekDates(today);
    var done = 0, futureOpen = 0;
    for (var i = 0; i < 7; i++) {
      var d = days[i], isDone = !!(task.log && task.log[ymd(d)]);
      var rel = d < today ? "past" : (d > today ? "future" : "today");
      if (isDone) done++;
      if (!isDone && rel !== "past") futureOpen++;
    }
    return { done: done, goal: goal, reached: done >= goal, doomed: (done + futureOpen) < goal, needMore: Math.max(0, goal - done) };
  }
  function avoidStatus(task) {
    var today = stripTime(new Date());
    var created = task.created ? parseYmd(task.created) : today;
    var week = weekDates(today), slipsThisWeek = 0;
    for (var i = 0; i < 7; i++) { var d = week[i]; if (d <= today) slipsThisWeek += (task.slips && task.slips[ymd(d)]) || 0; }
    var total = 0;
    if (task.slips) { for (var k in task.slips) { total += task.slips[k]; } }
    var streak = 0, cur = new Date(today);
    while (cur >= created) { if (((task.slips && task.slips[ymd(cur)]) || 0) > 0) break; streak++; cur.setDate(cur.getDate() - 1); }
    var daysLeft = null, finished = false;
    if (task.deadline) { daysLeft = Math.round((parseYmd(task.deadline) - today) / 86400000); finished = daysLeft < 0; }
    return { slipsThisWeek: slipsThisWeek, total: total, streak: streak, daysLeft: daysLeft, finished: finished, todayCount: (task.slips && task.slips[ymd(today)]) || 0 };
  }
  // mode: "current" = 지금까지 실제 발생한 것만, "projected" = 이번 주 끝났다고 가정한 예상
  function weeklyTotals(mode) {
    mode = mode || "current";
    var projected = mode === "projected";
    var earn = 0, fine = 0, totalDone = 0;
    var today = stripTime(new Date());
    state.tasks.forEach(function (t) {
      if ((t.type || "do") === "avoid") {
        var s = avoidStatus(t), a = avNums(t);
        fine += Math.max(0, s.slipsThisWeek - a.limit) * a.penalty; // 이미 초과분 = 실제 발생
        if (projected && a.reward > 0 && s.slipsThisWeek <= a.limit) earn += a.reward; // 보상은 주 끝까지 지켜야 = 예상만
      } else if (isDateDo(t)) {
        var ds = dueDoStatus(t), dn = doNums(t);
        if (ds.done && t.doneDate && sameWeek(parseYmd(t.doneDate), today)) totalDone += 1;
        if (ds.done) { if (ds.dueThisWeek) earn += dn.reward; }
        else if (projected) { if (ds.dueThisWeek) fine += dn.penalty; } // 예상: 이번 주 마감이면 미완료 벌금
        else { if (ds.overdue && ds.dueThisWeek) fine += dn.penalty; } // 현재: 이미 기한 지난 것만
      } else {
        var st = doStatus(t), d = doNums(t);
        totalDone += st.done; earn += st.done * d.reward; // 완료한 만큼 보상 = 실제 발생
        if (projected && !st.reached) fine += d.penalty; // 미달 벌금 = 예상만
      }
    });
    return { earn: earn, fine: fine, settle: earn - fine, totalDone: totalDone };
  }
  function dayActivity(key) {
    var done = 0, slip = 0;
    state.tasks.forEach(function (t) {
      if ((t.type || "do") === "avoid") { if (t.slips && t.slips[key]) slip += t.slips[key]; }
      else if (isDateDo(t)) { if (t.done && t.doneDate === key) done++; }
      else { if (t.log && t.log[key]) done++; }
    });
    return { done: done, slip: slip };
  }

  // ---------- 로그인 / 가입 ----------
  function showApp() {
    document.getElementById("authWrap").style.display = "none";
    document.querySelector(".wrap").style.display = "";
    document.querySelector(".tabbar").style.display = "";
    showTab("home");
  }
  function showAuth(mode) {
    document.getElementById("authWrap").style.display = "flex";
    document.querySelector(".wrap").style.display = "none";
    document.querySelector(".tabbar").style.display = "none";
    renderAuth(mode || "login");
    window.scrollTo(0, 0);
  }
  function enterApp(sess) {
    session = sess; saveSession();
    currentDataKey = dataKeyFor(sess);
    state = load();
    if (!state.tasks) state.tasks = [];
    if (sess.type === "user") {
      var acc = loadAccounts()[sess.email];
      if (!state.profile) state.profile = { name: (acc && acc.name) || sess.email.split("@")[0] };
      save();
    }
    showApp();
  }
  function logout() { session = null; try { localStorage.removeItem(SESS_KEY); } catch (e) {} showAuth("login"); }
  function doGuest() { enterApp({ type: "guest" }); }
  function doLogin(email, pw, errEl) {
    email = (email || "").trim().toLowerCase();
    if (!email || !pw) { errEl.textContent = "이메일과 비밀번호를 입력하세요."; return; }
    var acc = loadAccounts()[email];
    if (!acc || acc.pw !== pw) { errEl.textContent = "이메일 또는 비밀번호가 올바르지 않습니다."; return; }
    enterApp({ type: "user", email: email });
  }
  function doSignup(email, name, pw, errEl) {
    email = (email || "").trim().toLowerCase(); name = (name || "").trim();
    if (!validEmail(email)) { errEl.textContent = "올바른 이메일 형식이 아닙니다."; return; }
    if ((pw || "").length < 4) { errEl.textContent = "비밀번호는 4자 이상이어야 합니다."; return; }
    var accts = loadAccounts();
    if (accts[email]) { errEl.textContent = "이미 가입된 이메일입니다."; return; }
    accts[email] = { pw: pw, name: name || email.split("@")[0], createdAt: ymd(stripTime(new Date())) };
    saveAccounts(accts);
    enterApp({ type: "user", email: email });
  }
  function authInput(type, ph) {
    var i = document.createElement("input"); i.className = "auth-input"; i.type = type; i.placeholder = ph;
    if (type === "email") { i.autocapitalize = "off"; i.autocomplete = "email"; i.spellcheck = false; }
    return i;
  }
  function renderAuth(mode) {
    var host = document.getElementById("authBody"); host.innerHTML = "";
    var brand = document.createElement("div"); brand.className = "auth-brand"; brand.innerHTML = "<h1>다짐</h1>"; host.appendChild(brand);
    var err = document.createElement("div"); err.className = "auth-error";
    var sw = document.createElement("div"); sw.className = "auth-switch";
    var divider = document.createElement("div"); divider.className = "auth-divider"; divider.textContent = "또는";
    var guest = document.createElement("button"); guest.className = "auth-guest"; guest.textContent = "계정 없이 시작하기"; guest.onclick = doGuest;

    if (mode === "signup") {
      var em = authInput("email", "이메일"), nm = authInput("text", "닉네임"), pw = authInput("password", "비밀번호 (4자 이상)");
      var primary = document.createElement("button"); primary.className = "auth-primary"; primary.textContent = "가입하고 시작";
      primary.onclick = function () { doSignup(em.value, nm.value, pw.value, err); };
      [em, nm, pw].forEach(function (f) { f.addEventListener("keydown", function (e) { if (e.key === "Enter") primary.click(); }); });
      host.appendChild(em); host.appendChild(nm); host.appendChild(pw); host.appendChild(err); host.appendChild(primary);
      sw.innerHTML = '이미 계정이 있으신가요? <a>로그인</a>';
      sw.querySelector("a").onclick = function () { renderAuth("login"); };
    } else {
      var em2 = authInput("email", "이메일"), pw2 = authInput("password", "비밀번호");
      var primary2 = document.createElement("button"); primary2.className = "auth-primary"; primary2.textContent = "로그인";
      primary2.onclick = function () { doLogin(em2.value, pw2.value, err); };
      [em2, pw2].forEach(function (f) { f.addEventListener("keydown", function (e) { if (e.key === "Enter") primary2.click(); }); });
      host.appendChild(em2); host.appendChild(pw2); host.appendChild(err); host.appendChild(primary2);
      sw.innerHTML = '계정이 없으신가요? <a>가입</a>';
      sw.querySelector("a").onclick = function () { renderAuth("signup"); };
    }
    host.appendChild(sw); host.appendChild(divider); host.appendChild(guest);
  }

  // ---------- 탭 ----------
  function showTab(name) {
    ["home", "add", "profile"].forEach(function (t) { document.getElementById("screen-" + t).style.display = (t === name) ? "block" : "none"; });
    document.querySelectorAll(".tabbar .tab").forEach(function (b) { b.classList.toggle("active", b.getAttribute("data-tab") === name); });
    if (name === "home") render();
    if (name === "profile") renderProfile();
    window.scrollTo(0, 0);
  }

  // ---------- 홈 ----------
  function render() {
    var days = weekDates(new Date()), mon = days[0], sun = days[6];
    document.getElementById("ovLabel").textContent =
      "이번 주 · " + (mon.getMonth() + 1) + "/" + mon.getDate() + " – " + (sun.getMonth() + 1) + "/" + sun.getDate();
    var wt = weeklyTotals(settleMode);
    document.getElementById("homeEarn").textContent = "+" + won(wt.earn);
    document.getElementById("homeFine").textContent = "−" + won(wt.fine);
    document.getElementById("homeCount").textContent = wt.totalDone + "회";
    var a = document.getElementById("homeSettle");
    a.textContent = (wt.settle < 0 ? "−" : "+") + won(wt.settle);
    a.className = "settle-amt " + (wt.settle < 0 ? "neg" : "pos");
    var proj = settleMode === "projected";
    document.getElementById("settleCap").textContent = proj ? "예상 정산" : "현재 정산";
    document.getElementById("fineLabel").textContent = proj ? "예상 벌금" : "벌금";
    document.getElementById("settleToggle").textContent = proj ? "현재 보기" : "예상 보기";

    renderDeadlineAlert();
    renderCalendar();
    renderDayDetail();
  }

  function renderDeadlineAlert() {
    var host = document.getElementById("deadlineAlert"); host.innerHTML = "";
    var today = stripTime(new Date());
    var items = [];
    state.tasks.forEach(function (t) {
      if ((t.type || "do") === "avoid" && t.deadline) {
        var dl = Math.round((parseYmd(t.deadline) - today) / 86400000);
        if (dl >= 0) items.push({ task: t, daysLeft: dl, date: t.deadline, kind: "avoid" });
      } else if (isDateDo(t) && t.due && !t.done) {
        var dl2 = Math.round((parseYmd(t.due) - today) / 86400000);
        if (dl2 >= 0) items.push({ task: t, daysLeft: dl2, date: t.due, kind: "do" });
      }
    });
    if (!items.length) return;
    items.sort(function (a, b) { return a.daysLeft - b.daysLeft; });

    var card = document.createElement("div"); card.className = "deadline-alert";
    var ov = document.createElement("div"); ov.className = "overline"; ov.textContent = "다가오는 마감"; card.appendChild(ov);

    items.slice(0, 5).forEach(function (it) {
      var t = it.task, dl = parseYmd(it.date);
      var row = document.createElement("div"); row.className = "dl-item";
      var dd = document.createElement("div"); dd.className = "dl-dday" + (it.daysLeft <= 3 ? " soon" : "");
      dd.textContent = it.daysLeft === 0 ? "D-DAY" : "D-" + it.daysLeft;
      var body = document.createElement("div"); body.className = "dl-body";
      var nm = document.createElement("div"); nm.className = "dl-name"; nm.textContent = t.name;
      var sub = document.createElement("div"); sub.className = "dl-sub";
      if (it.kind === "do") { sub.textContent = "완료하면 +" + won(doNums(t).reward); }
      else { var st = avoidStatus(t); sub.textContent = st.total === 0 ? "아직 한 번도 안 어김" : "지금까지 " + st.total + "회 어김"; }
      body.appendChild(nm); body.appendChild(sub);
      var date = document.createElement("div"); date.className = "dl-date";
      date.textContent = (dl.getMonth() + 1) + "/" + dl.getDate();
      row.appendChild(dd); row.appendChild(body); row.appendChild(date);
      row.onclick = (function (key, mm, yy) { return function () { selectedDate = key; calCursor = { y: yy, m: mm }; render(); }; })(it.date, dl.getMonth(), dl.getFullYear());
      card.appendChild(row);
    });
    host.appendChild(card);
  }

  function renderCalendar() {
    var host = document.getElementById("calendar");
    host.innerHTML = "";
    var card = document.createElement("div"); card.className = "calendar";

    var head = document.createElement("div"); head.className = "cal-head";
    var title = document.createElement("div"); title.className = "cal-title";
    title.textContent = calCursor.y + "년 " + (calCursor.m + 1) + "월";
    var nav = document.createElement("div"); nav.className = "cal-nav";
    var todayBtn = document.createElement("button"); todayBtn.textContent = "오늘"; todayBtn.title = "오늘로 이동";
    todayBtn.style.cssText = "font-size:12px;font-weight:600;padding:6px 10px;letter-spacing:-0.01em;";
    todayBtn.onclick = function () { var t = stripTime(new Date()); calCursor = { y: t.getFullYear(), m: t.getMonth() }; selectedDate = ymd(t); render(); };
    nav.appendChild(todayBtn);
    var prev = document.createElement("button"); prev.title = "이전 달"; prev.appendChild(icon("chevL"));
    prev.onclick = function () { calCursor.m--; if (calCursor.m < 0) { calCursor.m = 11; calCursor.y--; } renderCalendar(); };
    var next = document.createElement("button"); next.title = "다음 달"; next.appendChild(icon("chevR"));
    next.onclick = function () { calCursor.m++; if (calCursor.m > 11) { calCursor.m = 0; calCursor.y++; } renderCalendar(); };
    nav.appendChild(prev); nav.appendChild(next);
    head.appendChild(title); head.appendChild(nav);
    card.appendChild(head);

    var dowRow = document.createElement("div"); dowRow.className = "cal-dow";
    DOW.forEach(function (w) { var s = document.createElement("span"); s.textContent = w; dowRow.appendChild(s); });
    card.appendChild(dowRow);

    var grid = document.createElement("div"); grid.className = "cal-grid";
    var today = stripTime(new Date()), todayKey = ymd(today);
    var deadlines = {};
    state.tasks.forEach(function (t) {
      if ((t.type || "do") === "avoid" && t.deadline) { (deadlines[t.deadline] = deadlines[t.deadline] || []).push(t.name); }
      else if (isDateDo(t) && t.due && !t.done) { (deadlines[t.due] = deadlines[t.due] || []).push(t.name); }
    });
    var first = new Date(calCursor.y, calCursor.m, 1);
    var startBlank = (first.getDay() + 6) % 7;
    var daysInMonth = new Date(calCursor.y, calCursor.m + 1, 0).getDate();

    for (var b = 0; b < startBlank; b++) { var bl = document.createElement("div"); bl.className = "cal-day blank"; grid.appendChild(bl); }

    for (var day = 1; day <= daysInMonth; day++) {
      var d = new Date(calCursor.y, calCursor.m, day), key = ymd(d);
      var cell = document.createElement("div");
      var cls = "cal-day";
      if (key === todayKey) cls += " today";
      if (key === selectedDate) cls += " selected";
      if (d > today) cls += " future";
      if (deadlines[key]) { cls += " deadline-day"; cell.title = "목표 마감: " + deadlines[key].join(", "); }
      cell.className = cls;

      var num = document.createElement("div"); num.className = "d-num"; num.textContent = day;
      cell.appendChild(num);

      var dots = document.createElement("div"); dots.className = "cal-dots";
      var act = dayActivity(key);
      var dc = Math.min(act.done, 3);
      for (var i2 = 0; i2 < dc; i2++) { var dt = document.createElement("span"); dt.className = "cal-dot done"; dots.appendChild(dt); }
      if (act.slip > 0) { var sd = document.createElement("span"); sd.className = "cal-dot slip"; dots.appendChild(sd); }
      if (deadlines[key]) { var dl = document.createElement("span"); dl.className = "cal-dot deadline"; dots.appendChild(dl); }
      if (state.events && state.events[key] && state.events[key].length) { var ev = document.createElement("span"); ev.className = "cal-dot event"; dots.appendChild(ev); }
      cell.appendChild(dots);

      (function (k) { cell.onclick = function () { selectedDate = k; render(); }; })(key);
      grid.appendChild(cell);
    }
    card.appendChild(grid);

    var legend = document.createElement("div"); legend.className = "cal-legend";
    function legItem(dotCls, label) {
      var sp = document.createElement("span");
      var dot = document.createElement("i"); dot.className = "cal-dot " + dotCls;
      sp.appendChild(dot); sp.appendChild(document.createTextNode(label)); return sp;
    }
    legend.appendChild(legItem("done", "완료"));
    legend.appendChild(legItem("slip", "어김"));
    if (Object.keys(deadlines).length) legend.appendChild(legItem("deadline", "목표 마감"));
    if (state.events && Object.keys(state.events).some(function (k) { return state.events[k].length; })) legend.appendChild(legItem("event", "이 날 할 일"));

      task.limit = Math.max(0, Math.round(n(document.getElementById("avLimit").value, DEF.avLimit)));
      task.penalty = Math.max(0, n(document.getElementById("avPenalty").value, DEF.avPenalty));
      task.reward = Math.max(0, n(document.getElementById("avReward").value, DEF.avReward));
    } else if (currentDoMode === "date") {
      var due = document.getElementById("doDueInput").value;
      if (!due) { alert("목표 날짜를 선택하세요."); return; }
      task.mode = "date"; task.due = due; task.done = false;
      task.reward = Math.max(0, n(document.getElementById("doDateReward").value, DEF.doReward));
      task.penalty = Math.max(0, n(document.getElementById("doDatePenalty").value, DEF.doPenalty));
    } else {
      task.log = {};
      task.goal = Math.max(1, Math.round(n(document.getElementById("doGoal").value, DEF.doGoal)));
      task.reward = Math.max(0, n(document.getElementById("doReward").value, DEF.doReward));
      task.penalty = Math.max(0, n(document.getElementById("doPenalty").value, DEF.doPenalty));
    }
    state.tasks.push(task);
    input.value = ""; document.getElementById("deadlineInput").value = ""; document.getElementById("doDueInput").value = "";
    save(); showTab("home");
  }
  document.getElementById("addBtn").onclick = addTask;
  input.addEventListener("keydown", function (e) { if (e.key === "Enter") addTask(); });
  document.getElementById("settleToggle").onclick = function () { settleMode = (settleMode === "current") ? "projected" : "current"; render(); };
  updateAddVisibility();
  document.querySelectorAll(".tabbar [data-tab]").forEach(function (b) { b.onclick = function () { showTab(b.getAttribute("data-tab")); }; });

  session = loadSession();
  if (session && (session.type === "user" || session.type === "guest")) enterApp(session);
  else showAuth("login");
})();
</script>
</body>
</html>
